name: Public SDK checks
on:
  push:
  pull_request:
jobs:
  sdk:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/bootstrap.py
      - run: python tools/test_sdk.py
